[package]
name = "ostir"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
librna-sys = "0.2.2"
openmp-sys = "1.2.3"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1"

[profile.release]
lto = "fat"
